[project]
name = "random-number"
version = "0.1.0"
tags = ["synthetic", "single-turn", "distribution-matching"]
license = "Apache-2.0"
description = "Generate a uniformly random integer from a completion-style prompt (arXiv:2310.04363, Section 2)."
dependencies = [
    "verifiers>=0.1.9",
    "datasets",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["random_number.py"]
