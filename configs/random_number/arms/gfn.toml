# Distribution matching (GFlowNet fine-tuning): sample numbers in proportion
# to reward, i.e. uniformly over valid numbers. Invalid outputs get target
# weight min_reward relative to a valid one. There are about V^5 ≈ 8e25 invalid
# completions of up to 5 tokens (V ≈ 152k), so min_reward must sit far below
# 1/V^5 ≈ 1e-26 for them to carry negligible target mass: at 1e-40 their share
# is about 1e-17. A floor above 1/V^5 makes the target mostly gibberish, and
# the policy drifts there once its entropy grows.

[orchestrator.algo]
type = "gfn"
min_reward = 1e-40

# Keeps the overlay loadable on its own (tests/unit/test_configs.py).
[trainer]
