# Distribution matching (GFlowNet fine-tuning): sample completions in
# proportion to the env's reward, exp(log R). Valid numbers share log R = 0 and
# invalid completions get a length-scaled penalty, so the target is uniform over
# numbers with about 2e-4 of its mass on invalid completions. The env never
# returns less than e^-128 (a 5-token invalid completion); the floor sits below
# that and only catches rollouts that failed with reward 0.

[orchestrator.algo]
type = "gfn"
min_reward = 1e-60

# Keeps the overlay loadable on its own (tests/unit/test_configs.py).
[trainer]
