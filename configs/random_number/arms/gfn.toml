# Distribution matching (GFlowNet fine-tuning): sample numbers in proportion
# to reward, i.e. uniformly over valid numbers. Invalid outputs get target
# weight min_reward relative to a valid number; it must be small enough that
# the vast space of invalid sequences carries negligible target mass (1e-4
# lost ~7 points of validity in 20 steps).

[orchestrator.algo]
type = "gfn"
min_reward = 1e-10

# Keeps the overlay loadable on its own (tests/unit/test_configs.py).
[trainer]
