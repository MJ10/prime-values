# Reward maximization with a learned critic (PPO-style, the paper's baseline):
# one rollout per prompt, A_t = R - V_t.

[orchestrator]
group_size = 1

[orchestrator.algo]
type = "grpo"

[orchestrator.algo.baseline]
type = "value"

[value_function]

[value_function.ckpt]
interval = 50
resume_step = -1

[deployment]
gpus_per_node = 4
num_value_train_gpus = 1

# Once validity saturates every advantage is zero and the orchestrator stops
# the run, so checkpoint often enough that the last weights are the final policy.
[ckpt]
interval = 10

# Keeps the overlay loadable on its own (tests/unit/test_configs.py).
[trainer]
