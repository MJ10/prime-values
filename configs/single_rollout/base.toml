# Shared setup for the single-rollout vs group-rollout study on MATH.
# Compose with exactly one arm overlay:
#   uv run rl @ configs/single_rollout/base.toml @ configs/single_rollout/arms/<arm>.toml
#
# Every arm generates the same number of rollouts per step and runs the same
# four-GPU topology. Group arms train the critic for diagnostics only.

max_steps = 200
seq_len = 2048

[model]
name = "Qwen/Qwen3-0.6B"

[wandb]
project = "single-rollout-math"

# Resume from the latest checkpoint after a Slurm requeue; a fresh run starts
# from scratch because no checkpoint exists yet.
[ckpt]
interval = 25
resume_step = -1
keep_last = 2

[orchestrator]
batch_size = 256 # rollouts per step, identical across arms

[orchestrator.algo]
type = "grpo"

[orchestrator.renderer]
name = "qwen3"
enable_thinking = false

[orchestrator.train.sampling]
max_completion_tokens = 1536

# The v0 math-env scores in-process with a persistent math-verify worker pool;
# v1 math tasksets spawn a uv script per score, which stalls at 256 in-flight
# rollouts.
[[orchestrator.train.env]]
id = "math-env"
name = "hendrycks-math"
args = { dataset_name = "PrimeIntellect/Hendrycks-Math", dataset_subset = "default" }

[orchestrator.eval]
interval = 25

[orchestrator.eval.sampling]
max_completion_tokens = 1536

[[orchestrator.eval.env]]
id = "math-env"
name = "math500"
args = { dataset_name = "HuggingFaceH4/MATH-500", dataset_subset = "default", dataset_split = "test", question_key = "problem" }
group_size = 4

[trainer]

[inference]

[value_function]

[value_function.ckpt]
interval = 25
resume_step = -1

[deployment]
type = "single_node"
gpus_per_node = 4
num_infer_gpus = 1
num_train_gpus = 1
num_value_train_gpus = 1
